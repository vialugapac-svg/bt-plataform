<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório Final — Workshop PNE</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f4f0;
      --card: #ffffff;
      --border: #dedbd3;
      --text: #1a1a1a;
      --muted: #5f6875;
      --muted-soft: #7d8795;
      --brand: #1a2744;
      --part-blue: #1b4f9b;
      --part-blue-soft: #eef4ff;
      --part-orange: #c96c13;
      --part-orange-soft: #fff4e8;
      --part-green: #2f7d32;
      --part-green-soft: #edf7ee;
      --brand-soft: #eef4fb;
      --brand-line: #c9d7e9;
      --green: #2e7d32;
      --green-soft: #eef7ef;
      --amber: #9a6700;
      --amber-soft: #fff8e6;
      --red: #c62828;
      --red-soft: #fff3f3;
      --purple: #6d5b96;
      --purple-soft: #f3effb;
      --shadow: 0 8px 26px rgba(26, 39, 68, 0.06);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .ft-page {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 16px 16px 40px;
    }

    .ft-state {
      padding: 36px 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
    }

    .report-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .report-back {
      color: #566274;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .report-back:hover {
      color: var(--brand);
      text-decoration: underline;
    }

    .report-print-btn {
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .report-print-btn:hover {
      opacity: 0.88;
    }

    @media print {
      @page { size: A4; margin: 12mm; }
      
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      
      .report-toolbar { display: none !important; }
      .footer-note { display: none !important; }
      body { background: #fff !important; }
      .ft-page { padding: 0 !important; }
      
      /* Preserve card backgrounds and borders */
      .story-card, .flow-card, .lens-card, .report-section, .application-card, .case-card, .participant-box, .measure-card, .fmif-step {
        break-inside: avoid;
        box-shadow: none !important;
      }
      
      /* Preserve component grid colors */
      .component-card.is-strong { background: var(--green-soft) !important; border-color: #c8e3cc !important; }
      .component-card.is-attention { background: var(--red-soft) !important; border-color: #f0d0d0 !important; }
      .component-card.is-neutral { background: #f8f9fb !important; border-color: #e4e6ea !important; }
      
      /* Preserve box accents */
      .box-accent-green { border-left: 4px solid var(--green) !important; }
      .box-accent-red { border-left: 4px solid var(--red) !important; }
      .box-accent-blue { border-left: 4px solid #1b4f9b !important; }
      .box-accent-purple { border-left: 4px solid var(--purple) !important; }
      
      /* Preserve confidence/entry door badges */
      .confidence-pill.low { background: #f1f2f4 !important; color: #55606f !important; border-color: #d7dbe2 !important; }
      .confidence-pill.medium { background: #fff6e8 !important; color: #8c5a00 !important; border-color: #edd4a3 !important; }
      .confidence-pill.high { background: #edf7ef !important; color: #2e7d32 !important; border-color: #c8e3cc !important; }
      
      .entry-door-badge.prepare { background: #eef2f7 !important; color: #405067 !important; border-color: #cfd8e4 !important; }
      .entry-door-badge.explore { background: #eef4fb !important; color: #1b4f9b !important; border-color: #c9d7eb !important; }
      .entry-door-badge.experiment { background: #fff6e8 !important; color: #8c5a00 !important; border-color: #edd4a3 !important; }
      .entry-door-badge.offer { background: #edf7ef !important; color: #2e7d32 !important; border-color: #c8e3cc !important; }
      .entry-door-badge.venture { background: #efeaf9 !important; color: #5c4691 !important; border-color: #d6cbee !important; }
      
      .origin-badge.internal { background: #fff6e8 !important; color: #8c5a00 !important; border-color: #edd4a3 !important; }
      .origin-badge.external { background: #eef4fb !important; color: #1b4f9b !important; border-color: #c9d7eb !important; }
      .origin-badge.mixed { background: #f3effb !important; color: #6d5b96 !important; border-color: #d9cff0 !important; }
      .origin-badge.undetermined { background: #f1f2f4 !important; color: #5b6574 !important; border-color: #d7dbe2 !important; }
      
      /* Preserve opportunity/blockchain hero boxes */
      .opportunity-hero { background: #eef4fb !important; border-color: #d9e3ef !important; }
      .blockchain-primary { background: #edf7ef !important; color: #0f5b46 !important; }
      
      /* Preserve workshop cards with colored top borders */
      .workshop-card.workshop-hero { border-top-color: var(--brand) !important; }
      .workshop-card.workshop-opportunity { border-top-color: #1b4f9b !important; }
      .workshop-card.workshop-origin { border-top-color: #6d5b96 !important; }
      .workshop-card.workshop-blockchain { border-top-color: #0f6e56 !important; }
      .workshop-card.workshop-next { border-top-color: #2e7d32 !important; }
      
      /* Preserve lens cards */
      .lens-card { background: #f8fafc !important; border-left-color: #1b4f9b !important; }
      
      /* Preserve tag and evidence list styling */
      .tag { background: #fff !important; color: #425067 !important; border-color: #dcd8cf !important; }
      .evidence-list li, .reason-list li, .support-list li { background: #fff !important; color: #445064 !important; border-color: #e8e4dc !important; }
      
      /* Preserve method notes and subtle notes */
      .method-note { background: #f4f6f9 !important; border-color: #d9e1ea !important; }
      .subtle-note { background: #f4f6f9 !important; }
      
      /* Prevent page breaks inside key sections */
      .strategic-path-card, .strategic-transaction-card, .strategic-highlight, .strategic-note {
        break-inside: avoid;
      }
      
      .part-section.part-2,
      .part-section.part-3,
      .part-section.part-4 {
        break-before: page;
      }
    }

    .ft-header {
      margin-bottom: 14px;
      padding: 24px;
      border-radius: 18px;
      background: var(--brand);
      color: #fff;
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin-bottom: 6px;
      color: #9aabc7;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .ft-header h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
    }

    .ft-header p {
      margin: 10px 0 0;
      color: #d2dbeb;
      font-size: 14px;
      line-height: 1.7;
    }

    .story-card,
    .flow-card,
    .lens-card {
      margin-bottom: 14px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .lens-card {
      border-left: 4px solid #1b4f9b;
      background: #f8fafc;
    }

    .lens-card p,
    .story-card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
    }

    .flow-card h2,
    .story-card h2 {
      margin: 0 0 10px;
      color: var(--brand);
      font-size: 21px;
      line-height: 1.25;
    }

    .flow-card p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
    }

    .reasoning-chain {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .chain-step {
      padding: 8px 10px;
      border: 1px solid #d8dee7;
      border-radius: 10px;
      background: #f7f8fa;
      color: #445064;
      font-size: 11px;
      font-weight: 700;
    }

    .chain-arrow {
      color: #8d97a4;
      font-size: 14px;
      font-weight: 700;
    }

    .story-host {
      display: grid;
      gap: 14px;
    }

    .section-step {
      display: inline-block;
      margin-bottom: 10px;
      color: #74839a;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .section-copy {
      margin-bottom: 16px !important;
    }

    .summary-grid,
    .three-grid,
    .blockchain-grid,
    .signal-grid {
      display: grid;
      gap: 12px;
    }

    .summary-grid,
    .signal-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .three-grid,
    .blockchain-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .info-box,
    .signal-box,
    .possibility-card,
    .origin-card,
    .entry-card,
    .opportunity-card {
      border: 1px solid #e5e2db;
      border-radius: 14px;
      background: #faf9f6;
      padding: 16px;
    }

    .info-box h3,
    .signal-box h3,
    .possibility-card h3,
    .origin-card h3,
    .entry-card h3,
    .opportunity-card h3 {
      margin: 0 0 10px;
      color: var(--brand);
      font-size: 15px;
      line-height: 1.35;
    }

    .info-box p,
    .signal-box p,
    .possibility-card p,
    .origin-card p,
    .entry-card p,
    .opportunity-card p {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .box-accent-green { border-left: 4px solid var(--green); }
    .box-accent-red { border-left: 4px solid var(--red); }
    .box-accent-blue { border-left: 4px solid #1b4f9b; }
    .box-accent-purple { border-left: 4px solid var(--purple); }

    .tag-list,
    .evidence-list,
    .reason-list,
    .support-list,
    .component-grid {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border: 1px solid #dcd8cf;
      border-radius: 10px;
      background: #fff;
      color: #425067;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.35;
    }

    .tag .tag-meta {
      color: #788396;
      font-size: 10px;
      font-weight: 600;
    }

    .evidence-list,
    .reason-list,
    .support-list {
      display: grid;
      gap: 8px;
    }

    .evidence-list li,
    .reason-list li,
    .support-list li {
      padding: 10px 12px;
      border: 1px solid #e8e4dc;
      border-radius: 10px;
      background: #fff;
      color: #445064;
      font-size: 12px;
      line-height: 1.6;
    }

    .opportunity-statement,
    .entry-door-badge,
    .origin-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .opportunity-statement {
      margin: 2px 0 14px;
      border: 1px solid var(--brand-line);
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 13px;
      letter-spacing: 0;
      text-transform: none;
      font-weight: 700;
      line-height: 1.6;
      border-radius: 14px;
    }

    .entry-door-badge.prepare { background: #eef2f7; color: #405067; border: 1px solid #cfd8e4; }
    .entry-door-badge.explore { background: #eef4fb; color: #1b4f9b; border: 1px solid #c9d7eb; }
    .entry-door-badge.experiment { background: #fff6e8; color: #8c5a00; border: 1px solid #edd4a3; }
    .entry-door-badge.offer { background: #edf7ef; color: #2e7d32; border: 1px solid #c8e3cc; }
    .entry-door-badge.venture { background: #efeaf9; color: #5c4691; border: 1px solid #d6cbee; }

    .origin-badge.internal { background: #fff6e8; color: #8c5a00; border: 1px solid #edd4a3; }
    .origin-badge.external { background: #eef4fb; color: #1b4f9b; border: 1px solid #c9d7eb; }
    .origin-badge.mixed { background: #f3effb; color: #6d5b96; border: 1px solid #d9cff0; }
    .origin-badge.undetermined { background: #f1f2f4; color: #5b6574; border: 1px solid #d7dbe2; }

    .signal-box {
      background: #fff;
    }

    .signal-label {
      display: block;
      margin-bottom: 8px;
      color: #7b8796;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .signal-value {
      display: block;
      margin-bottom: 8px;
      color: var(--brand);
      font-size: 16px;
      font-weight: 800;
      line-height: 1.3;
    }

    .signal-box small {
      color: #7c8796;
      font-size: 11px;
      line-height: 1.6;
    }

    .component-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .component-card {
      padding: 12px 13px;
      border: 1px solid #e6e2da;
      border-radius: 12px;
      background: #fff;
    }

    .component-card strong {
      display: block;
      margin-bottom: 5px;
      color: var(--brand);
      font-size: 13px;
      line-height: 1.35;
    }

    .component-card span {
      color: #6e7988;
      font-size: 11px;
      line-height: 1.55;
    }

    .component-card.is-strong { border-color: #c8e3cc; background: var(--green-soft); }
    .component-card.is-attention { border-color: #f0d0d0; background: var(--red-soft); }
    .component-card.is-neutral { border-color: #e4e6ea; background: #f8f9fb; }

    .subtle-note,
    .method-note {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #f4f6f9;
      color: #5d6877;
      font-size: 12px;
      line-height: 1.7;
    }

    .method-note {
      border: 1px solid #d9e1ea;
    }

    .context-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }

    .context-pill,
    .confidence-pill,
    .movement-pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .context-pill {
      border: 1px solid #c9d7eb;
      background: #eef4fb;
      color: #1b4f9b;
    }

    .confidence-pill.low { background: #f1f2f4; color: #55606f; border: 1px solid #d7dbe2; }
    .confidence-pill.medium { background: #fff6e8; color: #8c5a00; border: 1px solid #edd4a3; }
    .confidence-pill.high { background: #edf7ef; color: #2e7d32; border: 1px solid #c8e3cc; }

    .movement-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .movement-pill {
      background: #f3f5f8;
      border: 1px solid #dde3ea;
      color: #546174;
      letter-spacing: 0;
      text-transform: none;
      font-size: 11px;
    }

    .entry-card {
      border-top: 5px solid var(--brand);
      background: #fff;
    }

    .entry-card .entry-door-badge {
      margin: 2px 0 14px;
    }

    .workshop-stack {
      display: grid;
      gap: 14px;
    }

    .workshop-card {
      margin-bottom: 0;
      background: linear-gradient(180deg, #ffffff 0%, #fbfaf7 100%);
    }

    .workshop-card.workshop-hero {
      border-top: 5px solid var(--brand);
    }

    .workshop-card.workshop-opportunity {
      border-top: 5px solid #1b4f9b;
    }

    .workshop-card.workshop-origin {
      border-top: 5px solid #6d5b96;
    }

    .workshop-card.workshop-blockchain {
      border-top: 5px solid #0f6e56;
    }

    .workshop-card.workshop-next {
      border-top: 5px solid #2e7d32;
    }

    .workshop-lead {
      margin-bottom: 10px;
      color: #73829a;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .workshop-highlight {
      display: block;
      margin-bottom: 10px;
      color: var(--brand);
      font-size: 26px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .workshop-copy {
      max-width: 760px;
      color: #4f5c70 !important;
      font-size: 14px !important;
      line-height: 1.75 !important;
    }

    .insight-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .insight-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border: 1px solid #d7dbe2;
      border-radius: 999px;
      background: #fff;
      color: #445064;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.35;
    }

    .insight-pill strong {
      color: var(--brand);
    }

    .opportunity-hero {
      margin-top: 14px;
      padding: 18px;
      border: 1px solid #d9e3ef;
      border-radius: 16px;
      background: #eef4fb;
    }

    .opportunity-hero h3,
    .origin-hero h3,
    .blockchain-hero h3,
    .next-hero h3,
    .transition-card h3 {
      margin: 0 0 8px;
      color: var(--brand);
      font-size: 16px;
      line-height: 1.35;
    }

    .opportunity-hero p,
    .origin-hero p,
    .blockchain-hero p,
    .next-hero p,
    .transition-card p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
    }

    .evidence-inline,
    .secondary-inline {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.82);
      color: #48566c;
      font-size: 12px;
      line-height: 1.65;
    }

    .origin-hero,
    .blockchain-hero,
    .next-hero,
    .transition-card {
      margin-top: 14px;
      padding: 18px;
      border: 1px solid #e2dfd8;
      border-radius: 16px;
      background: #fff;
    }

    .blockchain-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 2px 0 10px;
      padding: 10px 14px;
      border-radius: 14px;
      background: #edf7ef;
      color: #0f5b46;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.4;
    }

    .secondary-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: #f6f8fb;
    }

    .secondary-inline span {
      display: inline-flex;
      align-items: center;
      padding: 7px 10px;
      border: 1px solid #dfe5ec;
      border-radius: 999px;
      background: #fff;
      color: #556477;
      font-size: 11px;
      font-weight: 700;
    }

    .details-card {
      border-top: 4px solid var(--brand);
      overflow: hidden;
    }

    .details-card summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
      list-style: none;
      padding: 20px 22px;
      color: var(--brand);
      font-size: 16px;
      font-weight: 800;
    }

    .details-card summary::-webkit-details-marker {
      display: none;
    }

    .details-card summary span {
      color: #6d7888;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.6;
    }

    .details-card summary::after {
      content: "＋";
      color: var(--brand);
      font-size: 22px;
      font-weight: 500;
      line-height: 1;
    }

    .details-card[open] summary::after {
      content: "–";
    }

    .details-body {
      padding: 0 22px 22px;
      border-top: 1px solid #ebe7df;
      background: #faf9f6;
    }

    .details-body .flow-card,
    .details-body .lens-card,
    .details-body .story-card {
      box-shadow: none;
      background: #fff;
    }

    .footer-note {
      margin-top: 14px;
      color: #717b88;
      font-size: 11px;
      line-height: 1.7;
      text-align: center;
    }

    @media (max-width: 820px) {
      .summary-grid,
      .three-grid,
      .blockchain-grid,
      .signal-grid,
      .component-grid {
        grid-template-columns: 1fr;
      }

      .ft-header {
        padding: 20px;
      }

      .story-card,
      .flow-card,
      .lens-card {
        padding: 18px;
      }
    }

    .report-section {
      margin-bottom: 14px;
      padding: 22px;

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { FT_KNOWLEDGE_BASE } from "./shared-discernment/ft-knowledge-base.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC1jgVmGLqbtGHpB3CJiYtC2nm4_FpdM0g",
      authDomain: "btmodel-asis.firebaseapp.com",

      projectId: "btmodel-asis",
      storageBucket: "btmodel-asis.firebasestorage.app",
      messagingSenderId: "177492900543",
      appId: "1:177492900543:web:8d7c3c3bd623464aefa40a"
    };

    const state = document.getElementById("state");
    const content = document.getElementById("content");
    const storyHost = document.getElementById("story-host");

    const commonJsModulePaths = new Map([
      ["component-dictionary", new URL("./shared-discernment/component-dictionary.js", import.meta.url)],
      ["blockchain-kb-opportunities", new URL("./shared-discernment/blockchain-kb-opportunities.js", import.meta.url)],
      ["blockchain-example-library", new URL("./shared-discernment/blockchain-example-library.js", import.meta.url)],
      ["profile-adapter", new URL("./shared-discernment/profile-adapter.js", import.meta.url)],
      ["opportunity-engine", new URL("./shared-discernment/opportunity-engine.js", import.meta.url)],
      ["entry-engine", new URL("./shared-discernment/entry-engine.js", import.meta.url)]
    ]);

    let ftRuntimePromise = null;

    function showError(message) {
      state.textContent = message;
      state.hidden = false;
      content.hidden = true;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function normalizeModuleRequest(request) {
      return request.replace(/^\.\//, "").replace(/\.js$/, "");
    }

    async function getFtRuntime() {
      if (ftRuntimePromise) return ftRuntimePromise;

      ftRuntimePromise = (async () => {
        const sources = new Map();
        await Promise.all([...commonJsModulePaths.entries()].map(async ([key, url]) => {
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`Não foi possível carregar o módulo ${key}.`);
          }
          sources.set(key, await response.text());
        }));

        const cache = new Map();

        function evaluateModule(key) {
          if (cache.has(key)) return cache.get(key).exports;
          const source = sources.get(key);
          if (!source) throw new Error(`Módulo não encontrado: ${key}`);

          const module = { exports: {} };
          cache.set(key, module);

          const localRequire = request => evaluateModule(normalizeModuleRequest(request));
          const wrapper = new Function("require", "module", "exports", `${source}\nreturn module.exports;`);
          wrapper(localRequire, module, module.exports);
          return module.exports;
        }

        return {
          componentDictionary: evaluateModule("component-dictionary"),
          blockchainKb: evaluateModule("blockchain-kb-opportunities"),
          exampleLibrary: evaluateModule("blockchain-example-library"),
          profileAdapter: evaluateModule("profile-adapter"),
          opportunityEngine: evaluateModule("opportunity-engine"),
          entryEngine: evaluateModule("entry-engine")
        };
      })();

      return ftRuntimePromise;
    }

    function areaRecordFromLabel(label) {
      const normalized = String(label || "").trim().toLowerCase();
      return FT_KNOWLEDGE_BASE.find(item => item.nome.toLowerCase() === normalized)
        || FT_KNOWLEDGE_BASE.find(item => item.id === normalized)
        || FT_KNOWLEDGE_BASE.find(item => item.id === "outros")
        || FT_KNOWLEDGE_BASE[0];
    }

    function componentMetaMap(runtime) {
      return runtime.componentDictionary?.components || {};
    }

    function componentName(runtime, componentNum, fallbackName) {
      return componentMetaMap(runtime)[componentNum]?.shortName || fallbackName || componentNum;
    }

    function componentScoreLabel(score) {
      if (score >= 5) return "muito saudável";
      if (score >= 4) return "saudável";
      if (score >= 3) return "neutro";
      if (score >= 2) return "frágil";
      return "crítico";
    }

    function componentCardClass(score) {
      if (score >= 4) return "is-strong";
      if (score <= 2) return "is-attention";
      return "is-neutral";
    }

    function scoreNarrative(score) {
      if (score >= 4) return "aparece como evidência forte no AS-IS";
      if (score <= 2) return "aparece como ponto de atenção no AS-IS";
      return "permanece sem sinal dominante no AS-IS";
    }

    function confidenceLabel(confidence) {
      if (confidence === "high") return "possibilidade fortemente sustentada";
      if (confidence === "medium") return "possibilidade plausível";
      return "sinal inicial";
    }

    function originLabel(origin) {
      if (origin === "INTERNAL") return "Predominantemente interna";
      if (origin === "EXTERNAL") return "Predominantemente externa";
      if (origin === "MIXED") return "Mista";
      return "Ainda indeterminada";
    }

    function originCopy(origin) {
      if (origin === "INTERNAL") {
        return "A leitura do motor associa a oportunidade principalmente a tensões, capacidades ou espaços já existentes no próprio modelo de negócio.";
      }
      if (origin === "EXTERNAL") {
        return "A leitura do motor associa a oportunidade principalmente à transformação do ambiente e da infraestrutura, sem exigir um problema interno dominante para justificá-la.";
      }
      if (origin === "MIXED") {
        return "A leitura do motor combina condições internas do modelo com uma transformação externa capaz de ampliar ou redirecionar a oportunidade.";
      }
      return "As evidências atuais ainda não permitem afirmar uma origem predominante para a oportunidade.";
    }

    function entryDoorClass(entryDoor) {
      if (entryDoor === "PREPARAR") return "prepare";
      if (entryDoor === "EXPLORAR") return "explore";
      if (entryDoor === "EXPERIMENTAR") return "experiment";
      if (entryDoor === "OFERECER") return "offer";
      if (entryDoor === "EMPREENDER") return "venture";
      return "prepare";
    }

    function entryDoorCopy(entryDoor) {
      if (entryDoor === "PREPARAR") return "Fortalecer condições antes de testar uma oportunidade.";
      if (entryDoor === "EXPLORAR") return "Observar, investigar e formular hipóteses antes de avançar.";
      if (entryDoor === "EXPERIMENTAR") return "Testar uma hipótese em escala controlada.";
      if (entryDoor === "OFERECER") return "Estruturar uma oferta com evidência já suficiente para ir ao mercado.";
      if (entryDoor === "EMPREENDER") return "Estruturar uma iniciativa mais robusta diante de uma combinação forte de oportunidade e capacidade.";
      return "Leitura prudente não disponível.";
    }

    function familyDescription(runtime, areaId, familyId) {
      const families = runtime.blockchainKb?.areas?.[areaId]?.families || [];
      return families.find(item => item.id === familyId)?.description || "Possibilidade associada à nova infraestrutura em foco.";
    }

    function mapParticipantProfile(participant, runtime) {
      const rawProfile = participant?.diagnostico?.profile || participant?.profile || participant?.setor || null;
      return runtime.profileAdapter?.adaptProfile ? runtime.profileAdapter.adaptProfile(rawProfile) : null;
    }

    function normalizeDiagnosticoComponentes(diagnostico, runtime) {
      const components = diagnostico?.componentes || {};
      return Object.fromEntries(Object.entries(components).map(([num, value]) => {
        const score = Number(value?.pontuacao);
        return [num, {
          nome: componentName(runtime, num, value?.nome),
          pontuacao: Number.isFinite(score) ? score : 0
        }];
      }));
    }

    function sortComponentEntries(componentes) {
      return Object.entries(componentes)
        .map(([num, value]) => ({ num, nome: value.nome, pontuacao: value.pontuacao }))
        .sort((left, right) => left.num.localeCompare(right.num));
    }

    function strongestComponents(componentes) {
      return sortComponentEntries(componentes)
        .filter(item => item.pontuacao >= 4)
        .sort((left, right) => right.pontuacao - left.pontuacao || left.num.localeCompare(right.num))
        .slice(0, 4);
    }

    function weakestComponents(componentes) {
      return sortComponentEntries(componentes)
        .filter(item => item.pontuacao <= 2)
        .sort((left, right) => left.pontuacao - right.pontuacao || left.num.localeCompare(right.num))
        .slice(0, 4);
    }

    function uniqueComponentsByNum(items) {
      const seen = new Set();
      return (items || []).filter(item => {
        if (!item || !item.componentNum || seen.has(item.componentNum)) return false;
        seen.add(item.componentNum);
        return true;
      });
    }

    function evidenceSummaryText(result, strengths, tensions, runtime) {
      const leverageNames = uniqueComponentsByNum(result.leverages).map(item => componentName(runtime, item.componentNum));
      const tensionNames = uniqueComponentsByNum(result.tensions).map(item => componentName(runtime, item.componentNum));

      if (leverageNames.length && tensionNames.length) {
        return `O motor lê o AS-IS como uma combinação de alavancas em ${leverageNames.join(", ")} e tensões em ${tensionNames.slice(0, 3).join(", ")}.`;
      }
      if (leverageNames.length) {
        return `O motor identifica alavancas mais claras em ${leverageNames.join(", ")}.`;
      }
      if (tensionNames.length) {
        return `O motor lê o AS-IS com predominância de tensões em ${tensionNames.slice(0, 3).join(", ")}.`;
      }
      if (strengths.length) {
        return `O AS-IS mostra componentes relativamente estáveis, mas ainda sem uma tensão ou alavanca dominante para priorização imediata.`;
      }
      return `O AS-IS permanece sem sinais dominantes claros: nem forças muito destacadas, nem tensões fortes o bastante para definir uma direção prioritária.`;
    }

    function joinComponentNames(items, runtime, limit = 2) {
      return uniqueComponentsByNum(items).slice(0, limit).map(item => componentName(runtime, item.componentNum)).join(", ");
    }

    function firstRelevantEvidence(result) {
      return (result.businessOpportunityEvidence || [])[0] || null;
    }

    function workshopSummaryHeadline(context) {
      const { engineResult, componentes, runtime } = context;
      const strengths = strongestComponents(componentes);
      const weaknesses = weakestComponents(componentes);

      if (!engineResult.businessOpportunity && weaknesses.length >= 3 && strengths.length === 0) {
        return "Seu AS-IS mostra um modelo que ainda precisa ganhar base antes de avançar.";
      }
      if (engineResult.businessOpportunity && strengths.length >= 3 && weaknesses.length === 0) {
        return "Seu AS-IS mostra um modelo forte, com espaço para observar novas frentes de valor.";
      }
      if (engineResult.businessOpportunity && strengths.length > 0 && weaknesses.length > 0) {
        return "Seu AS-IS combina base real para avançar com pontos específicos que ainda pedem atenção.";
      }
      if (!engineResult.businessOpportunity && strengths.length > 0 && weaknesses.length > 0) {
        return "Seu AS-IS mostra sinais mistos: há bases úteis, mas ainda sem uma direção dominante.";
      }
      if (!engineResult.businessOpportunity && strengths.length > 0) {
        return `Seu AS-IS mostra estabilidade em ${joinComponentNames(strengths.map(item => ({ componentNum: item.num })), runtime)}, mas ainda sem uma oportunidade dominante.`;
      }
      return "Seu AS-IS ainda não aponta uma direção dominante, mas já mostra onde vale observar com mais atenção.";
    }

    function workshopSummaryBody(context) {
      const { engineResult, componentes, runtime } = context;
      const strengths = strongestComponents(componentes);
      const weaknesses = weakestComponents(componentes);
      const strengthNames = strengths.slice(0, 2).map(item => item.nome);
      const weaknessNames = weaknesses.slice(0, 2).map(item => item.nome);

      if (strengthNames.length && weaknessNames.length) {
        return `Hoje, as evidências sugerem forças em ${strengthNames.join(" e ")}, mas também tensões em ${weaknessNames.join(" e ")} que influenciam sua próxima decisão.`;
      }
      if (weaknessNames.length) {
        return `Hoje, o que mais chama atenção são tensões em ${weaknessNames.join(" e ")}. Isso ajuda a explicar por que a leitura pede prudência antes de avançar.`;
      }
      if (strengthNames.length) {
        return `Hoje, o modelo aparece mais consistente em ${strengthNames.join(" e ")}. Isso ajuda a sustentar uma leitura de oportunidade sem fabricar um problema interno.`;
      }
      return `As evidências ainda estão dispersas. Por isso, o FT View prioriza clareza sobre onde observar, sem forçar uma conclusão mais assertiva do que o AS-IS permite.`;
    }

    function workshopOpportunityReason(context) {
      const { engineResult, runtime } = context;
      const evidence = firstRelevantEvidence(engineResult);
      if (engineResult.businessOpportunity && evidence) {
        return `${componentName(runtime, evidence.componentNum)} foi a evidência mais claramente associada a esta leitura de negócio.`;
      }
      const primaryTension = uniqueComponentsByNum(engineResult.tensions || [])[0];
      if (primaryTension) {
        return `As evidências atuais ainda pesam mais em ${componentName(runtime, primaryTension.componentNum)} do que em uma direção clara de oportunidade.`;
      }
      return "As evidências ainda não formam um sinal forte o bastante para priorizar uma oportunidade de negócio dominante.";
    }

    function originWorkshopText(origin) {
      if (origin === "INTERNAL") {
        return "A principal oportunidade parece nascer mais de dentro do seu modelo atual do que de uma mudança externa dominante.";
      }
      if (origin === "EXTERNAL") {
        return "A principal oportunidade parece ganhar força porque o ambiente e a infraestrutura estão mudando ao redor do seu negócio.";
      }
      if (origin === "MIXED") {
        return "Existe uma oportunidade real no seu modelo atual, mas ela parece ser ampliada por uma transformação externa relevante.";
      }
      return "Ainda não há evidência suficiente para dizer se a principal força desta leitura vem mais de dentro do modelo ou do ambiente externo.";
    }

    function confidenceWorkshopText(confidence) {
      if (confidence === "high") return "aparece como uma possibilidade mais sustentada pelas evidências";
      if (confidence === "medium") return "aparece como uma possibilidade plausível a explorar";
      return "aparece apenas como um sinal inicial a explorar";
    }

    function primaryBlockchainText(context) {
      const { areaRecord, engineResult, runtime } = context;
      const primary = (engineResult.blockchainPossibilities || [])[0];
      if (!primary) {
        return {
          headline: "Nenhuma possibilidade Blockchain ganhou destaque nesta leitura.",
          body: "Neste momento, o FT View não identifica uma possibilidade principal suficientemente distinta para colocar em primeiro plano.",
          secondary: []
        };
      }
      const support = (primary.supportingEvidence || [])[0];
      const supportText = support
        ? `Isso se conecta especialmente aos sinais em ${componentName(runtime, support.componentNum)}.`
        : "Por enquanto, isso permanece como uma hipótese geral de infraestrutura a investigar.";
      return {
        headline: primary.name,
        body: `Na área de ${areaRecord.nome}, ${primary.name.toLowerCase()} ${confidenceWorkshopText(primary.confidence)}. ${supportText}`,
        secondary: (engineResult.blockchainPossibilities || []).slice(1, 3).map(item => item.name)
      };
    }

    function workshopNextMoveText(entryDoor, context) {
      const { engineResult, runtime } = context;
      const tensionName = joinComponentNames(engineResult.tensions || [], runtime, 2);
      const leverageName = joinComponentNames(engineResult.leverages || [], runtime, 2);

      if (entryDoor === "PREPARAR") {
        return tensionName
          ? `Antes de avançar, vale fortalecer bases que hoje limitam a captura de valor, especialmente em ${tensionName}.`
          : "Antes de avançar, vale fortalecer condições básicas do modelo para não antecipar um movimento maior do que a base atual suporta.";
      }
      if (entryDoor === "EXPLORAR") {
        return "O mais prudente agora é observar o que está mudando, formular hipóteses e escolher onde aprofundar, sem assumir uma resposta precoce.";
      }
      if (entryDoor === "EXPERIMENTAR") {
        return leverageName
          ? `Já existe base suficiente para testar uma hipótese em pequena escala, apoiando-se principalmente em ${leverageName}.`
          : "Já existe base suficiente para testar uma hipótese em pequena escala, mas ainda sem assumir oferta plena ou movimento mais robusto.";
      }
      if (entryDoor === "OFERECER") {
        return "A leitura sugere evidência suficiente para estruturar uma oferta mais clara, sem pular diretamente para uma aposta maior do que o necessário.";
      }
      if (entryDoor === "EMPREENDER") {
        return "A combinação entre oportunidade e capacidade parece forte o bastante para sustentar uma iniciativa mais estruturada.";
      }
      return (context.entryResult.entryReasons || [])[0] || "A postura prudente depende da combinação entre evidências, oportunidade e capacidade atual.";
    }

    function currentParticipantQuery() {
      const params = new URLSearchParams(window.location.search);
      const workshopId = params.get("workshop");
      const participanteId = params.get("participante");
      if (!workshopId || !participanteId) return "";
      return `?${new URLSearchParams({ workshop: workshopId, participante: participanteId }).toString()}`;

    function rememberParticipantPayload(participant) {
      try {
        sessionStorage.setItem("ft-view-last-participant", JSON.stringify(participant));
      } catch {}
    }

    function restoreParticipantPayload() {
      try {
        const raw = sessionStorage.getItem("ft-view-last-participant");

      } catch {
        return null;
      }

    function updateBackLink() {
      const backLink = document.getElementById("report-back-link");
      if (!backLink) return;
      backLink.href = `./ft-view.html${currentParticipantQuery()}`;
    }

    function mountAsisSnapshot(participant) {
      const host = document.getElementById("asis-snapshot-host");
      if (!host) return;

      const snapshot = participant?.diagnostico?.relatorioFinal || {};
      const asisHtml = String(snapshot.html || "").trim();
      const asisCss = String(snapshot.css || "").trim();

      if (!asisHtml) {
        host.innerHTML = `<div class="asis-report-fallback">O relatório AS-IS completo não está disponível neste participante.</div>`;
        return;
      }

      const safeHtml = asisHtml.replace(/<script[\s\S]*?>[\s\S]*?<\/script>/gi, "");
      const safeCss = asisCss.replace(/<\/style>/gi, "");
      const root = host.shadowRoot || host.attachShadow({ mode: "open" });
      root.innerHTML = `
        <style>
          ${safeCss}
          body { margin: 0 !important; background: #fff !important; }
          .page { max-width: 100% !important; padding: 0 !important; }
          .back-btn,
          .asis-print-btn,
          .mentor-wait-btn,
          #ft-wait-message,
          .result-sync-status,
          .footer { display: none !important; }
        </style>
        ${safeHtml}
      `;
    }

    const COMPONENT_PATH1_APPLICATION_IDS = {
      "01": ["registro_compartilhado", "prova_propriedade", "tokenizacao"],
      "02": ["liquidacao_organizacoes", "coordenacao_participantes", "registro_compartilhado"],
      "03": ["tokenizacao", "prova_propriedade", "custodia_digital"],

      "05": ["tokenizacao", "prova_propriedade", "custodia_digital"],
      "06": ["liquidacao_organizacoes", "coordenacao_participantes", "custodia_digital"],
      "07": ["registro_compartilhado", "coordenacao_participantes", "liquidacao_organizacoes"],
      "08": ["custodia_digital", "coordenacao_participantes", "prova_propriedade"],
      "09": ["coordenacao_participantes", "liquidacao_organizacoes", "registro_compartilhado"],

    };

    function normalizeRealCases(cases) {
      return (cases || []).filter(item =>
        item
        && item.name
        && item.howItWorks
        && item.blockchainRole
        && item.firstStep
        && item.sourceUrl
      );
    }

    function allCaseBackedApplications(runtime) {
      const map = new Map();
      const components = runtime?.exampleLibrary?.BLOCKCHAIN_EXAMPLE_LIBRARY?.components || {};
      Object.values(components).forEach(component => {
        (component?.adherences || []).forEach(adherence => {
          const normalizedCases = normalizeRealCases(adherence.realCases);
          if (!normalizedCases.length || map.has(adherence.id)) return;
          map.set(adherence.id, {
            id: adherence.id,
            title: adherence.title,
            businessDescription: adherence.businessDescription,
            realCases: normalizedCases
          });
        });
      });
      return map;
    }

    function selectPath1ApplicationsByComponent(runtime, componentId) {
      const byId = allCaseBackedApplications(runtime);
      const preferred = COMPONENT_PATH1_APPLICATION_IDS[componentId] || [];
      const selected = preferred
        .map(id => byId.get(id))
        .filter(Boolean)
        .slice(0, 3)
        .map(item => ({ ...item, featuredCase: item.realCases[0] || null }))
        .filter(item => item.featuredCase);

      if (selected.length === 3) return selected;

      const fallback = Array.from(byId.values())
        .filter(item => !selected.some(sel => sel.id === item.id))
        .map(item => ({ ...item, featuredCase: item.realCases[0] || null }))
        .filter(item => item.featuredCase)
        .slice(0, Math.max(0, 3 - selected.length));

      return [...selected, ...fallback].slice(0, 3);
    }

    function flattenedRealCases(runtime) {
      const components = runtime?.exampleLibrary?.BLOCKCHAIN_EXAMPLE_LIBRARY?.components || {};
      const cases = [];
      Object.values(components).forEach(component => {
        (component?.adherences || []).forEach(adherence => {
          (adherence?.realCases || []).forEach(realCase => {
            if (realCase?.name && realCase?.sourceUrl) {
              cases.push(realCase);
            }
          });
        });
      });
      return cases;
    }

    function fixedFinancialCases(runtime) {
      const allCases = flattenedRealCases(runtime);
      const visa = allCases.find(item => /visa/i.test(item.name || ""));
      const thunes = allCases.find(item => /thunes/i.test(item.name || ""));
      const immersve = allCases.find(item => /immersve/i.test(item.name || ""));
      return [
        visa ? {
          company: visa.name,
          whatTheyDid: "A Visa testou liquidação com USDC entre instituições para acelerar transferências de valor entre parceiros.",

          sourceUrl: visa.sourceUrl
        } : null,
        thunes ? {
          company: thunes.name,
          whatTheyDid: "A Thunes integrou USDC para reduzir dependência de janelas bancárias em parte da liquidação internacional.",
          whyItMatters: "Mostra que pagamentos internacionais podem ganhar continuidade e previsibilidade em certos corredores.",
          realWorld: "No mundo real, ajuda quando uma empresa precisa mover valor entre países sem esperar apenas o horário bancário tradicional.",

          sourceUrl: immersve.sourceUrl
        } : null
      ].filter(Boolean).slice(0, 3);
    }

    function formatCriteriaList(criteria) {
      const list = Array.isArray(criteria) ? criteria.filter(Boolean) : [];
      if (!list.length) return "<li>tempo</li><li>custo</li><li>rastreabilidade</li>";
      return list.map(item => `<li>${escapeHtml(item)}</li>`).join("");
    }

    function opportunityEvidenceText(runtime, item) {
      const name = componentName(runtime, item.componentNum);
      if ((item.value || 0) <= 2) {
        return `<strong>${escapeHtml(name)}</strong> aparece como gap ou tensão relevante nesta leitura.`;
      }
      if ((item.value || 0) >= 4) {
        return `<strong>${escapeHtml(name)}</strong> aparece como evidência forte para sustentar esta leitura de negócio.`;
      }
      return `<strong>${escapeHtml(name)}</strong> contribui como evidência complementar, ainda sem predomínio isolado.`;

    function supportingEvidenceText(runtime, item) {
      const name = componentName(runtime, item.componentNum);
      if ((item.value || 0) <= 2) {

      }
      if ((item.value || 0) >= 4) {
        return `<strong>${escapeHtml(name)}</strong> sustenta esta possibilidade como força ou capacidade já presente no modelo.`;
      }
      return `<strong>${escapeHtml(name)}</strong> aparece como sinal complementar, ainda em nível exploratório.`;
    }

    async function buildFtContext(participant) {
      const runtime = await getFtRuntime();
      const diagnostico = participant?.diagnostico || {};
      const componentes = normalizeDiagnosticoComponentes(diagnostico, runtime);

      if (!Object.keys(componentes).length) {
        throw new Error("As evidências estruturadas do AS-IS não estão disponíveis.");
      }

      const areaRecord = areaRecordFromLabel(diagnostico.setor || participant?.setor);
      const ftViewData = participant?.ftView || {};

      return {
        runtime,
        participant,
        areaRecord,
        componentes,
        ftViewData
      };
    }

    async function renderFromParticipant(participant) {
      const context = await buildFtContext(participant);
      storyHost.innerHTML = buildHtmlSections(context);
      mountAsisSnapshot(participant);
      rememberParticipantPayload(participant);
      updateBackLink();
      state.hidden = true;
      content.hidden = false;
      return context;
    }

    async function loadFtView() {
      try {
        const params = new URLSearchParams(window.location.search);
        const workshopId = params.get("workshop");
        const participanteId = params.get("participante");

        if (!workshopId || !participanteId) {
          const previewParticipant = restoreParticipantPayload();
          if (!previewParticipant) {
            showError("Abra o Relatório FT a partir do FT View Workshop ou utilize o renderizador de pré-visualização desta página.");
            return;
          }
          await renderFromParticipant(previewParticipant);
          return;
        }

        const db = getDatabase(initializeApp(firebaseConfig));
        const snapshot = await get(ref(db, `workshops/${workshopId}/participantes/${participanteId}`));

        if (!snapshot.exists()) {
          showError("O diagnóstico AS-IS não foi encontrado.");
          return;
        }

        const participant = snapshot.val();
        if (participant?.diagnostico?.ftViewLiberado !== true) {
          showError("FT View aguardando liberação do Mentor.");
          return;
        }

        await renderFromParticipant(participant);
      } catch (error) {
        console.error(error);
        showError("Não foi possível carregar o Relatório FT completo.");
      }
    }

    window.__ftViewRenderFromParticipantData = async participant => renderFromParticipant(participant);

    loadFtView();
  </script>
</body>
</html>
