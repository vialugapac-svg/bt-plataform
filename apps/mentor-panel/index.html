<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Mentor — Diagnósticos AS-IS</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; background:#f5f4f0; color:#1a1a1a; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .page { width:min(1040px,100%); margin:0 auto; padding:28px 20px 48px; }
    .header { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; padding-bottom:20px; border-bottom:1px solid #ddd9cf; }
    .eyebrow { margin-bottom:6px; color:#6f7f99; font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; }
    h1 { color:#1a2744; font-size:26px; line-height:1.2; }
    .header p { margin-top:6px; color:#6f6f6f; font-size:13px; }
    .live { display:flex; align-items:center; gap:7px; color:#42604a; font-size:12px; font-weight:600; white-space:nowrap; }
    .live::before { content:""; width:8px; height:8px; border-radius:50%; background:#3b914d; box-shadow:0 0 0 4px #dcecdf; }
    .summary { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:20px 0 12px; }
    .summary h2 { color:#1a2744; font-size:16px; }
    .count { color:#777; font-size:12px; }
    .list { overflow:hidden; background:#fff; border:1px solid #dedbd3; border-radius:14px; }
    .row { display:grid; grid-template-columns:minmax(170px,1.3fr) minmax(150px,1fr) 125px 90px 105px 150px; align-items:center; gap:14px; width:100%; padding:16px 18px; border:0; border-top:1px solid #eeece6; background:#fff; color:inherit; font:inherit; text-align:left; cursor:pointer; }
    .row:first-child { border-top:0; }
    .row:hover { background:#faf9f6; }
    .row-head { background:#f8f7f3; color:#858585; cursor:default; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
    .row-head:hover { background:#f8f7f3; }
    .participant strong { display:block; color:#1a2744; font-size:14px; }
    .participant span, .business, .date { color:#6f6f6f; font-size:12px; line-height:1.4; }
    .maturity { color:#1a2744; font-size:16px; font-weight:750; }
    .status { display:inline-flex; justify-content:center; border-radius:20px; padding:5px 9px; font-size:10px; font-weight:700; text-transform:uppercase; }
    .status.done { background:#e5f2e8; color:#246735; }
    .status.progress { background:#fff1d9; color:#80530b; }
    .ft-control { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
    .ft-status { font-size:11px; font-weight:700; white-space:nowrap; }
    .ft-status.locked { color:#6f7782; }
    .ft-status.released { color:#27723a; }
    .release-button { border:1px solid #1a2744; border-radius:7px; padding:6px 8px; background:#fff; color:#1a2744; cursor:pointer; font-family:inherit; font-size:10px; font-weight:600; white-space:nowrap; }
    .release-button:hover { background:#1a2744; color:#fff; }
    .release-button:disabled { border-color:#d1d4d8; background:#f2f2f2; color:#999; cursor:not-allowed; }
    .empty, .error, .loading { padding:48px 20px; color:#777; font-size:13px; text-align:center; }
    .error { color:#8e3030; }
    @media (max-width:760px) {
      .page { padding:20px 14px 36px; }
      .header { align-items:flex-start; flex-direction:column; }
      .row-head { display:none; }
      .row { grid-template-columns:1fr auto; gap:8px 14px; padding:16px; }
      .participant { grid-column:1; }
      .business { grid-column:1; }
      .date { grid-column:1; }
      .maturity { grid-column:2; grid-row:1; text-align:right; }
      .status { grid-column:2; grid-row:2; }
      .ft-control { grid-column:2; grid-row:3; justify-content:flex-end; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <div class="eyebrow">Projeto Nova Economia</div>
        <h1>Painel do Mentor</h1>
        <p>Diagnósticos AS-IS gravados no Firebase</p>
      </div>
      <div class="live">Atualização em tempo real</div>
    </header>

    <div class="summary">
      <h2>Participantes</h2>
      <span class="count" id="count">Carregando…</span>
    </div>

    <section class="list" id="diagnosticos" aria-live="polite">
      <div class="loading">Carregando diagnósticos…</div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC1jgVmGLqbtGHpB3CJiYtC2nm4_FpdM0g",
      authDomain: "btmodel-asis.firebaseapp.com",
      databaseURL: "https://btmodel-asis-default-rtdb.firebaseio.com",
      projectId: "btmodel-asis",
      storageBucket: "btmodel-asis.firebasestorage.app",
      messagingSenderId: "177492900543",
      appId: "1:177492900543:web:8d7c3c3bd623464aefa40a"
    };

    const db = getDatabase(initializeApp(firebaseConfig));
    const list = document.getElementById("diagnosticos");
    const count = document.getElementById("count");

    function formatarData(valor) {
      if (!valor) return "Data não disponível";
      const data = new Date(valor);
      if (Number.isNaN(data.getTime())) return "Data não disponível";
      return new Intl.DateTimeFormat("pt-BR", { dateStyle:"short", timeStyle:"short" }).format(data);
    }

    function criarTexto(tag, classe, texto) {
      const elemento = document.createElement(tag);
      elemento.className = classe;
      elemento.textContent = texto;
      return elemento;
    }

    function abrirDiagnostico(workshopId, participanteId) {
      const params = new URLSearchParams({ workshop:workshopId, participante:participanteId });
      window.location.href = `./diagnostico.html?${params.toString()}`;
    }

    async function liberarFtView(evento, workshopId, participanteId) {
      evento.stopPropagation();
      const botao = evento.currentTarget;
      botao.disabled = true;
      try {
        await update(ref(db, `workshops/${workshopId}/participantes/${participanteId}/diagnostico`), {
          ftViewLiberado: true
        });
      } catch (error) {
        console.error(error);
        botao.disabled = false;
        alert("Não foi possível liberar o FT View. Tente novamente.");
      }
    }

    function renderizar(workshops) {
      const registros = [];
      Object.entries(workshops || {}).forEach(([workshopId, workshop]) => {
        Object.entries(workshop?.participantes || {}).forEach(([participanteId, participante]) => {
          registros.push({ workshopId, participanteId, participante });
        });
      });

      registros.sort((a,b) => {
        const dataA = a.participante.diagnostico?.geradoEm || a.participante.ultimoAcessoEm || a.participante.iniciadoEm || "";
        const dataB = b.participante.diagnostico?.geradoEm || b.participante.ultimoAcessoEm || b.participante.iniciadoEm || "";
        return dataB.localeCompare(dataA);
      });

      list.replaceChildren();
      count.textContent = `${registros.length} diagnóstico${registros.length === 1 ? "" : "s"}`;

      if (!registros.length) {
        list.appendChild(criarTexto("div", "empty", "Nenhum diagnóstico AS-IS foi gravado até o momento."));
        return;
      }

      const head = document.createElement("div");
      head.className = "row row-head";
      ["Participante", "Negócio / contexto", "Data", "Maturidade", "Status", "FT View"].forEach(texto => head.appendChild(criarTexto("span", "", texto)));
      list.appendChild(head);

      registros.forEach(({ workshopId, participanteId, participante }) => {
        const concluido = participante.status === "concluido";
        const percentual = participante.diagnostico?.percentualGeral;
        const data = participante.diagnostico?.geradoEm || participante.ultimoAcessoEm || participante.iniciadoEm;
        const liberado = participante.diagnostico?.ftViewLiberado === true;
        const button = document.createElement("div");
        button.className = "row";
        button.tabIndex = 0;
        button.setAttribute("role", "button");
        button.setAttribute("aria-label", `Abrir diagnóstico de ${participante.nome || "participante"}`);
        button.addEventListener("click", () => abrirDiagnostico(workshopId, participanteId));
        button.addEventListener("keydown", evento => {
          if (evento.key === "Enter" || evento.key === " ") abrirDiagnostico(workshopId, participanteId);
        });

        const participant = document.createElement("span");
        participant.className = "participant";
        participant.appendChild(criarTexto("strong", "", participante.nome || "Participante sem nome"));
        participant.appendChild(criarTexto("span", "", `Workshop ${workshopId}`));
        button.appendChild(participant);
        button.appendChild(criarTexto("span", "business", participante.contextoNome || "Contexto não informado"));
        button.appendChild(criarTexto("span", "date", formatarData(data)));
        button.appendChild(criarTexto("span", "maturity", Number.isFinite(percentual) ? `${percentual}%` : "—"));
        button.appendChild(criarTexto("span", `status ${concluido ? "done" : "progress"}`, concluido ? "Concluído" : "Em andamento"));
        const ftControl = document.createElement("span");
        ftControl.className = "ft-control";
        ftControl.appendChild(criarTexto("span", `ft-status ${liberado ? "released" : "locked"}`, liberado ? "🟢 Liberado" : "🔒 Bloqueado"));
        if (!liberado) {
          const releaseButton = criarTexto("button", "release-button", "Liberar FT View");
          releaseButton.type = "button";
          releaseButton.disabled = !participante.diagnostico;
          releaseButton.addEventListener("click", evento => liberarFtView(evento, workshopId, participanteId));
          ftControl.appendChild(releaseButton);
        }
        button.appendChild(ftControl);
        list.appendChild(button);
      });
    }

    onValue(ref(db, "workshops"), snapshot => renderizar(snapshot.val() || {}), error => {
      console.error(error);
      count.textContent = "Falha na leitura";
      list.replaceChildren(criarTexto("div", "error", "Não foi possível carregar os diagnósticos do Firebase."));
    });
  </script>
</body>
</html>
