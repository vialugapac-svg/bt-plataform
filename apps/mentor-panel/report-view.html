<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BT Model — Painel do Mentor</title>
<script type="module">
 window.gerarRelatorioWorkshop = function(data){
    window.atualizarPainel(data);
}
</script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1523; color: #fff; min-height: 100vh; }
.painel { max-width: 1100px; margin: 0 auto; padding: 24px; }

/* HEADER */
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
.header h1 { font-size: 22px; font-weight: 600; color: #fff; }
.header p { font-size: 13px; color: #8899bb; margin-top: 2px; }
.live-badge { display: flex; align-items: center; gap: 6px; background: #1a2744; padding: 8px 16px; border-radius: 20px; font-size: 13px; color: #aabbdd; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: #43A047; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* RESUMO */
.resumo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 28px; }
.resumo-card { background: #1a2744; border-radius: 12px; padding: 16px; text-align: center; }
.resumo-num { font-size: 32px; font-weight: 700; color: #fff; }
.resumo-label { font-size: 12px; color: #8899bb; margin-top: 4px; }

/* SEÇÃO */
.secao-titulo { font-size: 14px; font-weight: 600; color: #8899bb; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 14px; margin-top: 28px; }

/* TABELA DE COMPONENTES POR EQUIPE */
.tabela-wrap { overflow-x: auto; margin-bottom: 28px; }
table { width: 100%; border-collapse: collapse; min-width: 600px; }
th { font-size: 11px; font-weight: 600; color: #8899bb; text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 12px; text-align: left; border-bottom: 1px solid #1a2744; }
th.comp-th { text-align: center; }
td { padding: 10px 12px; border-bottom: 1px solid #1a2744; font-size: 13px; color: #ccd; }
td.equipe-td { font-weight: 600; color: #fff; white-space: nowrap; }
.celula { width: 36px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; margin: 0 auto; }
.celula.vazia { background: #1a2744; color: #445; }

/* GRID DE COMPONENTES COM MÉDIA */
.comp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 28px; }
.comp-card { background: #1a2744; border-radius: 12px; padding: 16px; }
.comp-card-num { font-size: 11px; color: #8899bb; margin-bottom: 4px; }
.comp-card-nome { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 12px; }
.barra-wrap { margin-bottom: 6px; }
.barra-label { display: flex; justify-content: space-between; font-size: 11px; color: #8899bb; margin-bottom: 4px; }
.barra { height: 8px; background: #0f1523; border-radius: 4px; overflow: hidden; }
.barra-fill { height: 8px; border-radius: 4px; transition: width 0.5s; }
.media-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-top: 8px; }

/* TABULEIRO VISUAL */
.tabuleiro-wrap { display: flex; justify-content: center; margin-bottom: 28px; }
.tabuleiro { position: relative; width: 420px; height: 420px; }
.anel-externo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; border: 3px solid #1a2744; }
.centro { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 120px; height: 120px; border-radius: 50%; background: #1a2744; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 10; }
.centro-titulo { font-size: 11px; font-weight: 600; color: #aabbdd; text-transform: uppercase; letter-spacing: 0.06em; }
.centro-val { font-size: 28px; font-weight: 700; color: #fff; }
.centro-label { font-size: 10px; color: #8899bb; }
.segmento-label { position: absolute; font-size: 10px; font-weight: 600; color: #fff; text-align: center; line-height: 1.2; text-shadow: 0 1px 3px rgba(0,0,0,0.5); pointer-events: none; }

/* OBSERVAÇÕES */
.obs-lista { display: flex; flex-direction: column; gap: 10px; }
.obs-item { background: #1a2744; border-radius: 10px; padding: 14px 16px; border-left: 4px solid #333; }
.obs-item-header { display: flex; justify-content: space-between; margin-bottom: 6px; flex-wrap: wrap; gap: 6px; }
.obs-equipe { font-size: 12px; font-weight: 600; color: #aabbdd; }
.obs-comp { font-size: 12px; color: #8899bb; }
.obs-texto { font-size: 13px; color: #ccd; line-height: 1.5; }

/* VAZIO */
.vazio-msg { text-align: center; padding: 60px 20px; color: #8899bb; }
.vazio-msg h2 { font-size: 18px; margin-bottom: 8px; color: #aabbdd; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="painel">

  <div class="header">
    <div>
      <h1>Painel do Mentor — BT Model Cristocêntrico</h1>
      <p>Diagnóstico AS-IS em tempo real · atualiza automaticamente</p>
    </div>
    <div class="live-badge"><div class="live-dot"></div>Ao vivo</div>
  </div>

  <div style="display:flex;justify-content:flex-end;margin:18px 0">
<button id="btnRelatorio" onclick="gerarRelatorioWorkshop()" style="background:#1B4F9B;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer">📄 Gerar Relatório Executivo</button>
</div>
<div id="conteudo">
    <div class="vazio-msg">
      <h2>Aguardando respostas…</h2>
      <p>As equipes ainda não iniciaram o preenchimento do AS-IS.</p>
    </div>
  </div>

</div>

<script>
const comps = [
  { num:"01", nome:"Propósito",           grupo:"Por Quê", cor:"#4A4A4A" },
  { num:"02", nome:"Problema/Oport.",     grupo:"O Quê",   cor:"#1B4F9B" },
  { num:"03", nome:"Proposta de Valor",   grupo:"O Quê",   cor:"#1B4F9B" },
  { num:"04", nome:"Processos",           grupo:"Como",    cor:"#C85A1E" },
  { num:"05", nome:"Ativos",              grupo:"Como",    cor:"#C85A1E" },
  { num:"06", nome:"Canais",              grupo:"Como",    cor:"#C85A1E" },
  { num:"07", nome:"Ecossistema",         grupo:"Quem",    cor:"#2E7D3C" },
  { num:"08", nome:"Clientes/Pessoas",    grupo:"Quem",    cor:"#2E7D3C" },
  { num:"09", nome:"Jornada",             grupo:"Quem",    cor:"#2E7D3C" },
  { num:"10", nome:"Custos/External.",    grupo:"Quanto",  cor:"#C4920A" },
  { num:"11", nome:"Receitas/Impactos",   grupo:"Quanto",  cor:"#C4920A" }
];

const percLabel = { ms:"Muito saudável", sa:"Saudável", in:"Instável", fr:"Frágil", cr:"Crítico" };
const percCor   = { ms:"#43A047",        sa:"#7CB342",  in:"#FDD835",  fr:"#FB8C00", cr:"#E53935" };
const percValor = { ms:5, sa:4, in:3, fr:2, cr:1 };
const percFonte = { ms:"#fff", sa:"#fff", in:"#333", fr:"#fff", cr:"#fff" };

window.atualizarPainel = function(data) {
  const equipes = Object.keys(data || {});
  const conteudo = document.getElementById('conteudo');
  if (!equipes.length) {
    conteudo.innerHTML = `<div class="vazio-msg"><h2>Aguardando respostas…</h2><p>As equipes ainda não iniciaram o preenchimento do AS-IS.</p></div>`;
    return;
  }

  // Calcular médias por componente
  const medias = comps.map((c, i) => {
    const chave = `comp_${c.num}`;
    let soma = 0, count = 0;
    const distribuicao = { ms:0, sa:0, in:0, fr:0, cr:0 };
    equipes.forEach(eq => {
      const resp = data[eq]?.[chave];
      if (resp?.percepcao) {
        soma += percValor[resp.percepcao] || 0;
        count++;
        distribuicao[resp.percepcao]++;
      }
    });
    return { media: count ? (soma/count) : null, count, distribuicao };
  });

  // Calcular média geral
  const mediasValidas = medias.filter(m => m.media !== null);
  const mediaGeral = mediasValidas.length ? mediasValidas.reduce((a,m)=>a+m.media,0)/mediasValidas.length : null;

  function classMedia(v) {
    if (!v) return null;
    if (v >= 4.5) return 'ms';
    if (v >= 3.5) return 'sa';
    if (v >= 2.5) return 'in';
    if (v >= 1.5) return 'fr';
    return 'cr';
  }

  // Coletar observações
  const obs = [];
  equipes.forEach(eq => {
    comps.forEach(c => {
      const resp = data[eq]?.[`comp_${c.num}`];
      if (resp?.observacao && resp.observacao.trim()) {
        obs.push({ equipe: resp.equipe || eq, comp: c.nome, texto: resp.observacao, percepcao: resp.percepcao });
      }
    });
  });

  // Montar HTML
  let html = '';

  // Resumo
  html += `<div class="resumo-grid">
    <div class="resumo-card"><div class="resumo-num">${equipes.length}</div><div class="resumo-label">Equipes respondendo</div></div>
    <div class="resumo-card"><div class="resumo-num">${mediasValidas.length * equipes.length > 0 ? medias.filter(m=>m.count>0).length : 0}</div><div class="resumo-label">Componentes avaliados</div></div>
    <div class="resumo-card"><div class="resumo-num" style="color:${mediaGeral ? percCor[classMedia(mediaGeral)] : '#8899bb'}">${mediaGeral ? mediaGeral.toFixed(1) : '—'}</div><div class="resumo-label">Média geral (1–5)</div></div>
    <div class="resumo-card"><div class="resumo-num">${obs.length}</div><div class="resumo-label">Observações registradas</div></div>
  </div>`;

  // Tabela por equipe
  html += `<div class="secao-titulo">Percepção por equipe e componente</div>
  <div class="tabela-wrap"><table>
    <thead><tr>
      <th>Equipe</th>
      ${comps.map(c=>`<th class="comp-th">${c.num}</th>`).join('')}
    </tr></thead>
    <tbody>`;

  equipes.forEach(eq => {
    const nomeEq = data[eq]?.[`comp_01`]?.equipe || eq;
    html += `<tr><td class="equipe-td">${nomeEq}</td>`;
    comps.forEach(c => {
      const resp = data[eq]?.[`comp_${c.num}`];
      if (resp?.percepcao) {
        const cls = resp.percepcao;
        html += `<td><div class="celula" style="background:${percCor[cls]};color:${percFonte[cls]}">${cls.toUpperCase()}</div></td>`;
      } else {
        html += `<td><div class="celula vazia">—</div></td>`;
      }
    });
    html += `</tr>`;
  });

  // Linha de média
  html += `<tr style="border-top:2px solid #2a3a5a">
    <td class="equipe-td" style="color:#C4920A">Média</td>`;
  medias.forEach(m => {
    if (m.media) {
      const cls = classMedia(m.media);
      html += `<td><div class="celula" style="background:${percCor[cls]};color:${percFonte[cls]}">${m.media.toFixed(1)}</div></td>`;
    } else {
      html += `<td><div class="celula vazia">—</div></td>`;
    }
  });
  html += `</tr></tbody></table></div>`;

  // Grid de componentes
  html += `<div class="secao-titulo">Distribuição por componente</div><div class="comp-grid">`;
  comps.forEach((c, i) => {
    const m = medias[i];
    const total = m.count || 1;
    html += `<div class="comp-card" style="border-top:3px solid ${c.cor}">
      <div class="comp-card-num">${c.num} · ${c.grupo}</div>
      <div class="comp-card-nome">${c.nome}</div>`;

    ['ms','sa','in','fr','cr'].forEach(k => {
      const pct = m.count ? Math.round((m.distribuicao[k]/total)*100) : 0;
      if (pct > 0) {
        html += `<div class="barra-wrap">
          <div class="barra-label"><span>${percLabel[k]}</span><span>${m.distribuicao[k]} equipe(s)</span></div>
          <div class="barra"><div class="barra-fill" style="width:${pct}%;background:${percCor[k]}"></div></div>
        </div>`;
      }
    });

    if (m.media) {
      const cls = classMedia(m.media);
      html += `<div class="media-badge" style="background:${percCor[cls]};color:${percFonte[cls]}">Média: ${m.media.toFixed(1)} — ${percLabel[cls]}</div>`;
    } else {
      html += `<div class="media-badge" style="background:#1a2744;color:#8899bb">Sem respostas ainda</div>`;
    }
    html += `</div>`;
  });
  html += `</div>`;

  // Observações
  if (obs.length) {
    html += `<div class="secao-titulo">Observações registradas pelas equipes</div><div class="obs-lista">`;
    obs.forEach(o => {
      const cor = o.percepcao ? percCor[o.percepcao] : '#333';
      html += `<div class="obs-item" style="border-left-color:${cor}">
        <div class="obs-item-header">
          <span class="obs-equipe">👥 ${o.equipe}</span>
          <span class="obs-comp">📌 ${o.comp}</span>
        </div>
        <div class="obs-texto">${o.texto}</div>
      </div>`;
    });
    html += `</div>`;
  }

  conteudo.innerHTML = html;
};

async function gerarRelatorioWorkshop(){
 const btn=document.getElementById('btnRelatorio');
 btn.disabled=true;
 btn.innerText='Gerando PDF...';
 const {jsPDF}=window.jspdf;
 const pdf=new jsPDF('p','mm','a4');
 pdf.setFontSize(22);
 pdf.text('BT Model Cristocêntrico',20,20);
 pdf.setFontSize(15);
 pdf.text('Relatório Executivo do Workshop',20,30);
 pdf.setFontSize(11);
 pdf.text('Data: '+new Date().toLocaleString('pt-BR'),20,40);
 pdf.addPage();
 pdf.setFontSize(18);
 pdf.text('Resumo Executivo',20,20);
 const cards=[...document.querySelectorAll('.resumo-card')];
 let y=35;
 cards.forEach(c=>{
   const n=c.querySelector('.resumo-num')?.innerText||'';
   const l=c.querySelector('.resumo-label')?.innerText||'';
   pdf.setFontSize(12);
   pdf.text(l+': '+n,20,y);
   y+=10;
 });
 pdf.addPage();
 const canvas=await html2canvas(document.getElementById('conteudo'),{scale:2,backgroundColor:'#0f1523'});
 const img=canvas.toDataURL('image/png');
 const pw=190;
 const ph=canvas.height*pw/canvas.width;
 pdf.addImage(img,'PNG',10,10,pw,ph);
 pdf.save('Relatorio_BT_Model.pdf');
 btn.disabled=false;
 btn.innerText='📄 Gerar Relatório Executivo';
}

</script>
</body>
</html>
